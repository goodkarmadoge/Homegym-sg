<title>Build Your Bundle | HomeGym.sg</title>

<style>
/* EMBED PAGE. Deliberately bare.
   ─────────────────────────────────────────────────────────────────────────
   This page is the quiz and nothing else: no masthead, no hero band, no
   footer. Its job is to be dropped into the existing homegym.sg site, either
   in an iframe or by copying the component tag onto a Magento page, so every
   piece of surrounding chrome is the host page's to supply. A logo and a
   footer here would either duplicate the site's own or, worse, contradict them
   the next time the site's navigation changes.

   Everything inside <homegym-bundle-quiz> is styled in the shadow root by
   src/quiz/styles.js and cannot be reached from here, so what is left below is
   only what a host page cannot be relied on to set.

   TO EMBED WITHOUT AN IFRAME, load dist/homegym-bundle-quiz.min.js on any page
   and drop in the <homegym-bundle-quiz> tag below. The component registers
   itself and carries its own styles, so it needs nothing else. HANDOFF.md has
   the copy-paste snippet and the two things it is easy to leave out: the
   Archivo font, which is document-scoped and so cannot be loaded from inside
   the shadow root, and heading-level, which nests the quiz's headings under
   the host page's own. Neither applies here: this page loads Archivo itself,
   and as its own document it has no competing <h1>, so the tag below carries
   no heading-level and the component's default of 1 is correct.

   Note for anyone editing this file: script ORDER matters below, though no
   longer in the way it once did. verify used to identify the inlined bundle as
   the first script element on the page, so a stray closing script tag in this
   comment could misdirect it; it now finds the bundle by looking for the one
   that defines the element, which is what it actually is. What order still
   decides is that the analytics bridge has to run BEFORE the bundle, because
   quiz:start fires during element upgrade. verify checks that too. */

/* Transparent, not white: in an iframe or a content slot the host page's own
   background should show through, whatever it is. */
html, body { background: transparent; }

body{
  margin:0;
  color:#201e1d;
  /* Archivo is loaded by the page shell. The stack behind it matters more than
     usual here: an embed can land on a site that blocks Google Fonts. */
  font-family:Archivo, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* The only page-level layout left. The quiz sets its own internal rhythm; this
   just stops it running edge to edge on a wide screen or touching the sides on
   a phone. A host page that already constrains its content can override it. */
.quiz-mount{
  max-width:1180px;
  margin:0 auto;
  padding:clamp(16px,3vw,32px) clamp(16px,4vw,40px);
}

/* Reserve roughly the height the quiz occupies so an iframe does not jump as
   the custom element upgrades, then release it so short views are not padded. */
homegym-bundle-quiz{display:block}
homegym-bundle-quiz:not(:defined){min-height:620px}

.noscript{color:#605d5d;max-width:60ch}
.noscript a{color:#ae1800}
</style>

<div class="quiz-mount">
  <homegym-bundle-quiz
    currency="SGD"
    contact-url="https://homegym.sg/contact"
    whatsapp="6580423952"
  ></homegym-bundle-quiz>
  <noscript>
    <div class="noscript">

        or message us on WhatsApp and we will size a build for you.</p>
    </div>
  </noscript>
</div>

<!-- The analytics bridge sits ABOVE the quiz deliberately: quiz:start is
     emitted while the element upgrades, which happens the instant the bundle
     calls customElements.define, so a listener registered after it would never
     hear the event and the client's funnel would lose its denominator. Found
     in the browser, where every other event arrived and only that one did not.
     scripts/verify.mjs fails the build if this order is reversed.

     The tag below loads the ES modules straight from src/quiz/ in dev.
     scripts/build.mjs swaps that exact tag for the inlined single-file bundle
     when building dist/, matching it as one literal string, so renaming it
     fails the build loudly rather than shipping a page with no quiz. -->
<script>
/* ANALYTICS BRIDGE.
   ─────────────────────────────────────────────────────────────────────────
   The quiz fires bubbling, composed CustomEvents so a host page's GTM can
   listen at document level. In an iframe that document is THIS one, not the
   host's, so those events die at the frame boundary and the embedding site
   sees nothing: no funnel, no conversion, no idea anyone took the quiz. That
   is the one real cost of choosing the iframe over the component, and this is
   what buys it back.

   Each event is forwarded up as {type:'homegym-quiz:event', name, detail} and
   the parent pushes it into dataLayer. README.md, "Embedding it", has the
   listener.

   A no-op when the page is not in an iframe: the standalone page and the
   component embed already deliver these events to their own document, and
   forwarding them to yourself would double-count every conversion.

   ON targetOrigin "*", which is a deliberate choice and not an oversight.
   Unlike the height message below, this payload carries the visitor's answers
   and their matched bundle, so "any window may read it" deserves a reason.
   The reason is that this page cannot know which page on homegym.sg framed
   it, and the browser is already enforcing the boundary that matters:
   Content-Security-Policy frame-ancestors on this deployment permits only
   homegym.sg to frame it at all, so "*" resolves to an origin that header has
   already vetted. Widen that header and you widen this, which is why they are
   verified together in scripts/verify.mjs. */
(function () {
  if (window.parent === window) return;   // not embedded, nothing to forward

  var EVENTS = [
    'quiz:start', 'quiz:step', 'quiz:complete', 'quiz:product-click',
    'quiz:cta-click', 'quiz:alternate-view', 'quiz:restart'
  ];

  EVENTS.forEach(function (name) {
    document.addEventListener(name, function (e) {
      var detail;
      // structuredClone is not available everywhere and postMessage will throw
      // on anything it cannot clone, which would take the quiz down with it.
      // A JSON round trip is the cheap way to guarantee a plain, cloneable
      // object, and every payload here is already plain data.
      try {
        detail = JSON.parse(JSON.stringify(e.detail == null ? {} : e.detail));
      } catch (err) {
        detail = {};
      }
      try {
        window.parent.postMessage({ type: 'homegym-quiz:event', name: name, detail: detail }, '*');
      } catch (err) { /* a parent that cannot receive is not the quiz's problem */ }
    });
  });
}());
</script>

<script type="module" src="quiz/homegym-bundle-quiz.js"></script>

<script>
/* IFRAME AUTO-HEIGHT.
   ─────────────────────────────────────────────────────────────────────────
   An iframe does not grow with its content, so an embedded quiz would either
   be cut off at the result or sit in a tall box with dead space under the
   questions. This posts the document height to the parent whenever it changes,
   and README.md, "Embedding it", has the four-line listener that resizes the
   iframe.

   It is a no-op when the page is not in an iframe, so the standalone page and
   the component embed are unaffected.

   Only ever sends a number. targetOrigin is "*" because this page cannot know
   which page on homegym.sg embedded it, and the payload is a height, which is
   not worth protecting. The LISTENER is where the origin gets checked, and the
   snippet in the README does check it. */
(function () {
  if (window.parent === window) return;   // not embedded, nothing to report

  var mount = document.querySelector('.quiz-mount');
  var last = 0;

  /* MEASURE THE CONTENT, NOT THE DOCUMENT, and that distinction is the whole
     trick. documentElement.scrollHeight can never report less than the iframe's
     own viewport, so once the parent has grown the frame to fit a result page,
     the document reports that tall forever. Going back to question one then
     sends no message at all and the quiz sits in a screen of empty space.
     Measured against the real page: growing worked, shrinking silently did not.

     The mount element is in normal flow and shrinks freely, so it tells the
     truth in both directions. */
  function report() {
    if (!mount) return;
    var r = mount.getBoundingClientRect();
    var h = Math.ceil(r.height + r.top + (window.scrollY || 0));

    // A sub-pixel jitter loop between parent and child is a real failure mode
    // here, so only speak up when the change is worth acting on.
    if (Math.abs(h - last) < 2) return;
    last = h;
    window.parent.postMessage({ type: 'homegym-quiz:height', height: h }, '*');
  }

  // The quiz swaps whole views in and out of a shadow root; observing the mount
  // catches every one of those without needing to know the component exists.
  // The load and resize handlers cover first paint and the viewport changing
  // under a fixed-width iframe.
  if (window.ResizeObserver && mount) {
    new ResizeObserver(report).observe(mount);
  }
  window.addEventListener('load', report);
  window.addEventListener('resize', report);

  // Images arriving late change the height after everything else has settled.
  document.addEventListener('load', report, true);

  report();
}());
</script>

<!-- IFRAME-RESIZER, CHILD HALF.
     ─────────────────────────────────────────────────────────────────────────
     Requested 17 Sep 2026 to help with mobile resizing. It is the in-frame
     half of a TWO-PART library and does nothing on its own: it sits silent
     until a parent page running iframeResizer.min.js calls iframeResize() on
     the frame. Dropping this file in and changing nothing on homegym.sg
     changes nothing on homegym.sg. README.md, "Embedding it", has the parent
     snippet.

     It is additive, not a replacement. The reporter above still posts
     homegym-quiz:height, so a host that has not adopted iframe-resizer keeps
     working exactly as before and this tag is inert weight. Once the parent
     DOES run iframe-resizer, the host must drive the frame from one mechanism
     or the other and never both: two writers setting the same height is how
     you get a frame that oscillates instead of settling.

     Pinned to major 4 as specified. Two things follow from that and are worth
     knowing rather than discovering: v4 is MIT, while v5 moved to GPLv3 with a
     paid exception, so the `@4` is doing real licensing work and a casual bump
     to `@5` is a licence change; and `@4` floats to the newest 4.x on every
     load, which is a third party able to change what runs inside the client's
     page. Pinning an exact version with an integrity hash closes that, at the
     cost of updating it by hand. -->
<script src="https://cdn.jsdelivr.net/npm/iframe-resizer@4/js/iframeResizer.contentWindow.min.js"></script>
